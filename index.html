<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MemorIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="top">
      <h1 class="logo">Memor<span>IA</span></h1>
    </header>
    <main class="game">
      <p class="level-badge" id="level">Level 1 / 5</p>
      <p class="status" id="status" role="status" aria-live="polite">Loading...</p>
      <section class="dice" id="dice" aria-label="Dice"></section>
      <div class="table">
        <aside id="col-human"></aside>
        <div class="board" id="board"></div>
        <aside id="col-ai"></aside>
      </div>
    </main>
    <footer class="credits">
